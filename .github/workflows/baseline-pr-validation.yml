name: baseline-pr-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run --exclude "tests/integration/**"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx eslint "tests/integration/**/*.ts"
      - name: Validate baseline script syntax
        run: |
          for file in scripts/baseline/*.cjs tests/baseline/*.cjs; do
            node --check "$file"
          done

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valtriox_test
          POSTGRES_PASSWORD: valtriox_test_pass
          POSTGRES_DB: valtriox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valtriox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      REHEARSAL_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DIRECT_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.sha }}
      CATALOG_PROJECT_REF: ci-localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prepare isolated baseline-only Prisma history
        run: node scripts/baseline/prepare-baseline-only-prisma.cjs
      - name: Prisma migrate deploy (isolated baseline only)
        run: npx prisma migrate deploy --schema backups/baseline-only-prisma/schema.prisma
      - name: Verify isolated baseline migration status
        run: npx prisma migrate status --schema backups/baseline-only-prisma/schema.prisma
      - name: Capture CI catalog from replayed baseline
        env:
          CATALOG_DB_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
          CATALOG_OUTPUT: backups/ci-captured-catalog.json
        run: node scripts/baseline/capture-full-catalog.cjs
      - name: Compare CI catalog against expected baseline fixture
        env:
          PROD_CATALOG: tests/fixtures/expected-baseline-catalog.json
          REH_CATALOG: backups/ci-captured-catalog.json
          CATALOG_REPORT: backups/catalog-comparison.txt
          PROD_EXPECTED_SOURCE_KIND: versioned_baseline_fixture
          REH_EXPECTED_SOURCE_KIND: database_capture
          REH_EXPECTED_PROJECT_REF: ci-localhost
          REH_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REH_EXPECTED_CAPTURE_PROFILE: generic
        run: node scripts/baseline/compare-catalogs.cjs
      - name: Baseline catalog validation tests
        run: node tests/baseline/run-catalog-validation.cjs
      - name: Database target safety guard tests
        run: node tests/baseline/run-safety-guard-validation.cjs
      - name: Supabase pinned TLS tests
        run: node tests/baseline/run-supabase-tls-validation.cjs
      - name: Supplier migration recovery classifier tests
        run: node tests/baseline/run-supplier-recovery-validation.cjs
      - name: Apply full repository migration train via Prisma
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify full repository migration status
        run: npx prisma migrate status --schema prisma/schema.prisma
      - name: Verify full repository deploy is idempotent
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Integration tests
        run: npx vitest run tests/integration --reporter=verbose
      - name: Guarded Supplier migration recovery integration
        run: node tests/baseline/run-supplier-recovery-integration.cjs
      - name: Verify complete Supplier recovery evidence
        run: |
          for file in \
            manifest.json \
            rolled-back/application-data-before.json \
            rolled-back/capture-prestate-1-wrapper-evidence/manifest.json \
            rolled-back/capture-prestate-1-wrapper-evidence/prestate-receipt.json \
            rolled-back/failed-deploy-1-output.txt \
            rolled-back/failed-deploy-1-history.json \
            rolled-back/wrong-applied-output.txt \
            rolled-back/wrong-applied-history-before.json \
            rolled-back/wrong-applied-history-after.json \
            rolled-back/resolve-rolled-back-1-wrapper-evidence/recovery-result.json \
            rolled-back/capture-prestate-2-wrapper-evidence/manifest.json \
            rolled-back/capture-prestate-2-wrapper-evidence/prestate-receipt.json \
            rolled-back/failed-deploy-2-output.txt \
            rolled-back/failed-deploy-2-history.json \
            rolled-back/resolve-rolled-back-2-wrapper-evidence/recovery-result.json \
            rolled-back/retry-deploy-output.txt \
            rolled-back/retry-status-output.txt \
            rolled-back/no-op-deploy-output.txt \
            rolled-back/post-no-op-status-output.txt \
            rolled-back/application-data-after.json \
            rolled-back/integration-final-proof.json \
            partial-rejected/capture-prestate-wrapper-evidence/prestate-receipt.json \
            partial-rejected/history-before.json \
            partial-rejected/partial-applied-rejection-output.txt \
            partial-rejected/history-after.json \
            partial-rejected/integration-final-proof.json \
            applied/application-data-before.json \
            applied/capture-prestate-wrapper-evidence/prestate-receipt.json \
            applied/wrong-rolled-back-output.txt \
            applied/wrong-rolled-back-history-before.json \
            applied/wrong-rolled-back-history-after.json \
            applied/resolve-applied-wrapper-evidence/recovery-result.json \
            applied/post-resolve-status-output.txt \
            applied/no-op-deploy-output.txt \
            applied/post-no-op-status-output.txt \
            applied/application-data-after.json \
            applied/integration-final-proof.json; do
            test -s "backups/supplier-recovery-integration/$file"
          done
          for attempt in 1 2; do
            output="backups/supplier-recovery-integration/rolled-back/failed-deploy-$attempt-output.txt"
            grep -q 'P3018' "$output"
            grep -q '23514' "$output"
            grep -q '20260815_add_supplier_constraints_and_security' "$output"
            grep -q '"resolve_flag": "--rolled-back"' \
              "backups/supplier-recovery-integration/rolled-back/resolve-rolled-back-$attempt-wrapper-evidence/recovery-result.json"
          done
          grep -q '"resolve_flag": "--applied"' \
            backups/supplier-recovery-integration/applied/resolve-applied-wrapper-evidence/recovery-result.json
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('backups/supplier-recovery-integration');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          const sha256 = (data) => crypto.createHash('sha256').update(data).digest('hex');
          const migration = fs.readFileSync(
            'prisma/migrations/20260815_add_supplier_constraints_and_security/migration.sql'
          );
          if (manifest.evidence_kind !== 'synthetic_supplier_recovery_integration' ||
              manifest.production_recovery_proof !== false ||
              manifest.migration_name !== '20260815_add_supplier_constraints_and_security' ||
              manifest.migration_checksum !== sha256(migration) ||
              manifest.pr_head_sha !== process.env.PR_HEAD_SHA ||
              manifest.checkout_sha !== process.env.MERGE_SHA ||
              manifest.tested_merge_sha !== process.env.MERGE_SHA ||
              manifest.run_id !== process.env.GITHUB_RUN_ID ||
              manifest.run_attempt !== process.env.GITHUB_RUN_ATTEMPT ||
              manifest.integration_script_sha256 !== sha256(
                fs.readFileSync('tests/baseline/run-supplier-recovery-integration.cjs')
              )) {
            throw new Error('Supplier recovery integration manifest metadata mismatch');
          }
          const actual = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Evidence symlink: ${absolute}`);
              if (entry.isDirectory()) walk(absolute);
              else if (entry.isFile() && absolute !== path.join(root, 'manifest.json')) {
                const data = fs.readFileSync(absolute);
                actual.push({
                  path: path.relative(root, absolute).split(path.sep).join('/'),
                  bytes: data.length,
                  sha256: sha256(data),
                });
              }
            }
          };
          walk(root);
          actual.sort((left, right) => left.path.localeCompare(right.path));
          if (JSON.stringify(actual) !== JSON.stringify(manifest.files)) {
            throw new Error('Supplier recovery integration manifest file/hash mismatch');
          }
          if (manifest.files_sha256 !== sha256(JSON.stringify(actual, null, 2))) {
            throw new Error('Supplier recovery integration aggregate hash mismatch');
          }
          NODE
      - name: Upload Supplier recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: supplier-recovery-20260815_add_supplier_constraints_and_security-${{ github.event.pull_request.head.sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/supplier-recovery-integration
          if-no-files-found: error
          retention-days: 30
      - name: Verify live catalog exists before upload
        run: |
          test -s backups/ci-captured-catalog.json
          test -s backups/catalog-comparison.txt
          grep -qx "NO_DIFFS" backups/catalog-comparison.txt
      - name: Upload catalog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-comparison-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backups/ci-captured-catalog.json
            backups/catalog-comparison.txt
          if-no-files-found: error
          retention-days: 30

  path-b-migrate-resolve:
    name: Path B - Synthetic Adoption Proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valtriox_test
          POSTGRES_PASSWORD: valtriox_test_pass
          POSTGRES_DB: valtriox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valtriox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      REHEARSAL_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DIRECT_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.sha }}
      MIGRATION_NAME: 20260101000000_baseline
      FORWARD_MIGRATION_NAME: 20260815_add_supplier_constraints_and_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Replay baseline schema without Prisma history
        run: node scripts/baseline/replay-baseline.cjs
      - name: Create CI Data API roles with privileges to revoke
        run: node scripts/baseline/prepare-pathb-ci-roles.cjs
      - name: Seed representative FK-valid data
        run: node scripts/baseline/seed-rehearsal-for-pathb.cjs
      - name: Run guarded synthetic Path-B adoption and forward train
        run: node scripts/baseline/guarded-migrate-resolve.cjs "$MIGRATION_NAME"
      - name: Verify complete Path-B evidence
        run: |
          for file in \
            before-resolve-data-state.json \
            after-resolve-data-state.json \
            before-resolve-catalog.json \
            after-resolve-catalog.json \
            before-resolve-catalog-precondition.txt \
            before-resolve-migrate-status.txt \
            before-forward-migrate-status.txt \
            baseline-adoption-history.json \
            before-forward-data-state.json \
            supplier-privileges-before-forward.json \
            forward-migration-migrate-deploy.txt \
            after-forward-migrate-status.txt \
            after-forward-data-state.json \
            after-forward-catalog.json \
            after-forward-catalog-delta.txt \
            supplier-forward-security.json \
            no-op-after-forward-migrate-deploy.txt \
            final-after-no-op-forward-migrate-status.txt \
            migration-history.json \
            target-identity.json \
            manifest.json; do
            test -s "backups/path-b-evidence/$file"
          done
          tar -czf backups/path-b-evidence.tgz -C backups path-b-evidence
          sha256sum backups/path-b-evidence.tgz > backups/path-b-evidence.tgz.sha256
          export PATH_B_ARTIFACT_NAME="path-b-synthetic-${MIGRATION_NAME}-${FORWARD_MIGRATION_NAME}-${PR_HEAD_SHA}-${MERGE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PATH_B_ARTIFACT_NAME=$PATH_B_ARTIFACT_NAME" >> "$GITHUB_ENV"
          node -e "
            const fs=require('fs'),crypto=require('crypto');
            const bundle=fs.readFileSync('backups/path-b-evidence.tgz');
            const receipt={
              evidence_kind:'synthetic_path_b_upload_bundle',
              artifact_name:process.env.PATH_B_ARTIFACT_NAME,
              inner_bundle_sha256:crypto.createHash('sha256').update(bundle).digest('hex'),
              migration_names:[process.env.MIGRATION_NAME,process.env.FORWARD_MIGRATION_NAME],
              pr_head_sha:process.env.PR_HEAD_SHA,
              tested_merge_sha:process.env.MERGE_SHA,
              run_id:process.env.GITHUB_RUN_ID,
              run_attempt:process.env.GITHUB_RUN_ATTEMPT
            };
            fs.writeFileSync('backups/path-b-upload-manifest.json',JSON.stringify(receipt,null,2)+'\n');
          "
      - name: Upload Path B artifacts
        id: upload_path_b
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PATH_B_ARTIFACT_NAME }}
          path: |
            backups/path-b-evidence.tgz
            backups/path-b-evidence.tgz.sha256
            backups/path-b-upload-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish Path B artifact receipt
        run: |
          {
            echo "### Synthetic Path-B baseline + Supplier forward evidence"
            echo "- Artifact ID: ${{ steps.upload_path_b.outputs.artifact-id }}"
            echo "- Artifact URL: ${{ steps.upload_path_b.outputs.artifact-url }}"
            echo "- Artifact SHA-256: ${{ steps.upload_path_b.outputs.artifact-digest }}"
            echo "- Inner bundle manifest: backups/path-b-upload-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  baseline-validation-gate:
    name: Baseline Validation Gate
    needs:
      - typecheck
      - unit-tests
      - build
      - lint
      - integration-tests
      - path-b-migrate-resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every baseline validation job
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TESTS_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          PATH_B_RESULT: ${{ needs.path-b-migrate-resolve.result }}
        run: |
          for result in \
            "$TYPECHECK_RESULT" \
            "$TESTS_RESULT" \
            "$BUILD_RESULT" \
            "$LINT_RESULT" \
            "$INTEGRATION_RESULT" \
            "$PATH_B_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required baseline validation job finished with: $result" >&2
              exit 1
            fi
          done
