name: baseline-pr-validation

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run --exclude "tests/integration/**"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx eslint "tests/integration/**/*.ts"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valtriox_test
          POSTGRES_PASSWORD: valtriox_test_pass
          POSTGRES_DB: valtriox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valtriox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      REHEARSAL_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DIRECT_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy (baseline replay via Prisma)
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Capture CI catalog from replayed baseline
        env:
          CATALOG_DB_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
          CATALOG_OUTPUT: backups/ci-captured-catalog.json
        run: node scripts/baseline/capture-full-catalog.cjs
      - name: Compare CI catalog against expected baseline fixture
        env:
          PROD_CATALOG: tests/fixtures/expected-baseline-catalog.json
          REH_CATALOG: backups/ci-captured-catalog.json
        run: node scripts/baseline/compare-catalogs.cjs
      - name: Integration tests
        run: npx vitest run tests/integration --reporter=verbose
      - name: Verify live catalog exists before upload
        run: test -f backups/ci-captured-catalog.json
      - name: Upload catalog artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-comparison-${{ github.sha }}
          path: |
            backups/ci-captured-catalog.json
            docs/baseline-repair/catalog-comparison.txt
          retention-days: 30

  path-b-migrate-resolve:
    name: Path B - Migrate Resolve
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valtriox_test
          POSTGRES_PASSWORD: valtriox_test_pass
          POSTGRES_DB: valtriox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valtriox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
      DIRECT_DATABASE_URL: postgresql://valtriox_test:valtriox_test_pass@localhost:5432/valtriox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply all migrations (Path A baseline)
        run: npx prisma migrate deploy
      - name: Identify and remove last migration (simulate pending)
        run: |
          LAST_MIGRATION=$(node scripts/baseline/ci-remove-last-migration.cjs)
          echo "LAST_MIGRATION=$LAST_MIGRATION" >> $GITHUB_ENV
          echo "Simulating pending migration: $LAST_MIGRATION"
      - name: Capture BEFORE resolve row counts
        run: node scripts/baseline/ci-capture-row-counts.cjs before-resolve
      - name: Execute prisma migrate resolve (Path B)
        run: npx prisma migrate resolve --applied "$LAST_MIGRATION" --schema prisma/schema.prisma
      - name: Capture AFTER resolve row counts
        run: node scripts/baseline/ci-capture-row-counts.cjs after-resolve
      - name: Migration history proof
        run: node scripts/baseline/ci-verify-migration.cjs "$LAST_MIGRATION"
      - name: Compare before/after row counts
        run: |
          node -e "
            const fs=require('fs');
            const b=JSON.parse(fs.readFileSync('backups/before-resolve-row-counts.json','utf8'));
            const a=JSON.parse(fs.readFileSync('backups/after-resolve-row-counts.json','utf8'));
            const bM=new Map(b.counts.map(c=>[c.table,c.rows]));
            const aM=new Map(a.counts.map(c=>[c.table,c.rows]));
            const all=new Set([...bM.keys(),...aM.keys()]);
            let ok=true;
            for(const t of all){const bv=bM.get(t)??-1;const av=aM.get(t)??-1;if(bv!==av){console.error('DELTA: '+t+' before='+bv+' after='+av);ok=false;}}
            if(ok){console.log('ROW COUNT CHECK PASSED: No unexpected deltas (resolve is data-safe)');}
            else{process.exit(1);}
          "
      - name: Upload Path B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-resolve-${{ github.sha }}
          path: |
            backups/before-resolve-row-counts.json
            backups/after-resolve-row-counts.json
          retention-days: 30
